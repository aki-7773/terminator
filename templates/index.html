<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Terminator AI - Multi-Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">🤖</div>
                <h2>Terminator AI</h2>
            </div>
            <div class="chat-list" id="chatList">
                <!-- Populated by JavaScript -->
            </div>
            <div class="sidebar-footer">
                <!-- ADDED onclick directly and id for reference -->
                <button id="newChatBtn" class="new-chat-btn" onclick="window.createNewChat()">+ New Chat</button>
                <div class="status-indicator">
                    <span class="dot online"></span>
                    <span id="statusText">Online</span>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="main-chat">
            <div class="chat-header">
                <h1 id="chatName">Chat 1</h1>
                <div class="header-actions">
                    <button id="renameChatBtn" class="icon-btn" title="Rename Chat">✏️</button>
                    <button id="deleteChatBtn" class="icon-btn" title="Delete Chat">🗑️</button>
                </div>
            </div>
            <div class="chat-container" id="chatContainer">
                <div class="chat-messages" id="chatMessages">
                    <!-- Messages rendered by JavaScript -->
                </div>
            </div>
            <div class="typing-indicator" id="typingIndicator">
                <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            </div>
            <div class="input-area">
                <div class="input-container">
                    <input type="text" id="userInput" placeholder="Ask me anything..." autofocus>
                    <button id="sendButton" onclick="window.sendMessage()">➤</button>
                </div>
                <div class="quick-actions">
                    <button onclick="window.quickSend('help')" class="quick-btn">📖 Help</button>
                    <button onclick="window.quickSend('tell me a joke')" class="quick-btn">😂 Joke</button>
                    <button onclick="window.quickSend('search news')" class="quick-btn">🌐 Search</button>
                    <button onclick="window.quickSend('plot sin')" class="quick-btn">📊 Plot</button>
                    <button onclick="window.quickSend('draw circle')" class="quick-btn">🎨 Draw</button>
                    <button onclick="window.quickSend('weather in Bern')" class="quick-btn">🌤️ Weather</button>
                </div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <!-- Ensure functions are globally accessible -->
    <script>
        // Fallback: if script.js didn't attach to window, we do it here.
        // But script.js already does it.
        console.log('index.html: ensuring global functions exist');
        if (typeof window.createNewChat !== 'function') {
            console.warn('createNewChat not defined, defining fallback');
            window.createNewChat = function() {
                alert('New chat function called (fallback)');
            };
        }
    </script>
</body>
</html>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
